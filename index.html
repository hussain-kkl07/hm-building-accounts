<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>H.M.BUILDING ACCOUNTS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a3d91">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f3ee;--card:#fff;--tx:#1d2420;--mu:#6b746e;--ac:#1f6f50;--in:#1f6f50;--out:#b3382c;--bd:#dcdad2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1e2420;--tx:#e8ece9;--mu:#9aa49d;--ac:#4fb88d;--in:#4fb88d;--out:#e5766b;--bd:#2f3832}}
:root[data-theme="dark"]{--bg:#141816;--card:#1e2420;--tx:#e8ece9;--mu:#9aa49d;--ac:#4fb88d;--in:#4fb88d;--out:#e5766b;--bd:#2f3832}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Noto Sans Tamil",system-ui,sans-serif}
.w{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:16px;letter-spacing:.5px;margin:6px 0 12px;text-align:center;color:var(--ac)}
.logo{background:#fff;border-radius:14px;padding:8px;text-align:center;margin-bottom:6px}.logo img{max-width:260px;width:70%;height:auto}
h2{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between}
.nav button{width:42px;height:42px;font-size:20px}
.nav b{font-size:18px}
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.t3 div{background:var(--bg);border-radius:10px;padding:8px 4px;font-size:12px;color:var(--mu)}
.t3 strong{display:block;font-size:16px;color:var(--tx)}
.in{color:var(--in)!important}.out{color:var(--out)!important}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:10px;font-weight:600}
.seg button.on.i{background:var(--in);color:#fff;border-color:var(--in)}
.seg button.on.o{background:var(--out);color:#fff;border-color:var(--out)}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input{width:100%;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px;cursor:pointer}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);width:100%;margin-top:12px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.d{font-size:13px;color:var(--mu)}
.amt{font-weight:700;white-space:nowrap}
.acts{display:flex;gap:6px;margin-top:4px}
.acts button{padding:3px 10px;font-size:12px}
.acts .x{color:var(--out)}
.empty{text-align:center;color:var(--mu);padding:16px 0}
.sum{width:100%;border-collapse:collapse;font-size:13px}
.sum th{font-weight:500;color:var(--mu);text-align:right;padding-bottom:4px}
.sum th:first-child,.sum td:first-child{text-align:left}
.sum td{padding:6px 0;border-top:1px solid var(--bd);text-align:right}
.scr{overflow-x:auto}
</style>
</head>

function ty(e){return e.type==="out"?"out":"in"}
function setType(t){type=t;$("bi").className="i"+(t==="in"?" on":"");$("bo").className="o"+(t==="out"?" on":"");
  $("wl").textContent=t==="in"?"யாரிடமிருந்து (வாடகைதாரர்)":"யாருக்கு கொடுத்தோம்"}
function render(){
  $("mlabel").textContent=M[cm]+" "+cy;
  var pre=cy+"-"+pad(cm+1),items=data.filter(function(e){return e.date.indexOf(pre)===0}).sort(function(a,b){return a.date<b.date?-1:1});
  var ti=0,to=0;items.forEach(function(e){if(ty(e)==="in")ti+=e.amt;else to+=e.amt});
  $("tin").textContent=inr(ti);$("tout").textContent=inr(to);$("tbal").textContent=inr(ti-to);
  $("list").innerHTML=items.length?items.map(function(e){
    var o=ty(e)==="out";
    return '<div class="row"><div><b>'+esc(e.who)+'</b><div class="d">'+fd(e.date)+' · '+(o?'செலவு':'வரவு')+' · '+esc(e.why)+'</div>'+
    '<div class="acts"><button onclick="ed(\''+e.id+'\')">திருத்து</button><button class="x" onclick="del(\''+e.id+'\')">நீக்கு</button></div></div>'+
    '<div class="amt '+(o?'out':'in')+'">'+(o?'−':'+')+inr(e.amt)+'</div></div>'}).join(""):'<div class="empty">இந்த மாதம் பதிவு இல்லை</div>';
  var by={};data.forEach(function(e){var k=e.date.slice(0,7);by[k]=by[k]||{i:0,o:0};if(ty(e)==="in")by[k].i+=e.amt;else by[k].o+=e.amt});
  var ks=Object.keys(by).sort().reverse();
  $("sum").innerHTML=ks.length?'<tr><th>மாதம்</th><th>வரவு</th><th>செலவு</th><th>மீதி</th></tr>'+ks.map(function(k){var p=k.split("-"),v=by[k];
    return "<tr><td>"+M[+p[1]-1]+" "+p[0]+"</td><td class='in'>"+inr(v.i)+"</td><td class='out'>"+inr(v.o)+"</td><td>"+inr(v.i-v.o)+"</td></tr>"}).join(""):'<tr><td class="empty">—</td></tr>';
  fill("whol","who");fill("whyl","why");
}
function fill(id,f){var s={};data.forEach(function(e){s[e[f]]=1});$(id).innerHTML=Object.keys(s).map(function(v){return '<option value="'+esc(v)+'">'}).join("")}
function reset(){editId=null;$("who").value="";$("why").value="";$("amt").value="";$("date").value=today();$("ftitle").textContent="புதிய பதிவு";$("cancel").style.display="none"}
function ed(id){var e=data.filter(function(x){return x.id===id})[0];if(!e)return;editId=id;setType(ty(e));$("date").value=e.date;$("who").value=e.who;$("why").value=e.why;$("amt").value=e.amt;$("ftitle").textContent="பதிவை திருத்து";$("cancel").style.display="block";window.scrollTo(0,0)}
function del(id){if(!confirm("இந்த பதிவை நீக்கலாமா?"))return;data=data.filter(function(x){return x.id!==id});save();render()}
$("bi").onclick=function(){setType("in")};
$("bo").onclick=function(){setType("out")};
$("save").onclick=function(){
  var d=$("date").value,w=$("who").value.trim(),y=$("why").value.trim(),a=parseFloat($("amt").value);
  if(!d||!w||!y||isNaN(a)){alert("எல்லா விவரங்களையும் நிரப்பவும்");return}
  var rec={date:d,who:w,why:y,amt:a,type:type};
  if(editId){data=data.map(function(x){if(x.id===editId){rec.id=x.id;return rec}return x})}
  else{rec.id=""+Date.now();data.push(rec)}
  save();var p=d.split("-");cy=+p[0];cm=+p[1]-1;reset();render()};
$("cancel").onclick=reset;
$("prev").onclick=function(){cm--;if(cm<0){cm=11;cy--}render()};
$("next").onclick=function(){cm++;if(cm>11){cm=0;cy++}render()};
$("bk").onclick=function(){
  try{
    var b=new Blob([JSON.stringify({app:"HM_BUILDING_ACCOUNTS",data:data})],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(b);
    a.download="hm-building-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
    $("bmsg").textContent="பேக்கப் ஃபைல் டவுன்லோட் ஆகிறது (Downloads-ல் பார்க்கவும்)."
  }catch(e){$("bmsg").textContent="பேக்கப் எடுக்க முடியவில்லை."}
};
$("rs").onclick=function(){$("rf").click()};
$("rf").onchange=function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result),arr=j.data||j;
      if(!Array.isArray(arr))throw 0;
      if(!confirm(arr.length+" பதிவுகள் மீட்கப்படும். இப்போதுள்ள பதிவுகள் மாற்றப்படும். தொடரலாமா?"))return;
      data=arr.filter(function(e){return e&&e.date&&e.who&&e.why&&!isNaN(e.amt)});
      save();render();$("bmsg").textContent="மீட்பு முடிந்தது: "+data.length+" பதிவுகள்."
    }catch(e){$("bmsg").textContent="இது சரியான பேக்கப் ஃபைல் இல்லை."}
  };
  r.readAsText(f);this.value=""
};
$("tx").onclick=function(){var t=$("ta");t.value=JSON.stringify(data);t.focus();t.select();$("tmsg").textContent=data.length+" பதிவுகள். உரையை முழுவதும் Copy செய்யவும்."};
$("ti").onclick=function(){
  try{
    var j=JSON.parse($("ta").value),arr=j.data||j;
    if(!Array.isArray(arr))throw 0;
    if(!confirm(arr.length+" பதிவுகள் மீட்கப்படும். இப்போதுள்ள பதிவுகள் மாற்றப்படும். தொடரலாமா?"))return;
    data=arr.filter(function(e){return e&&e.date&&e.who&&e.why&&!isNaN(e.amt)});
    save();render();$("tmsg").textContent="மீட்பு முடிந்தது: "+data.length+" பதிவுகள்."
  }catch(e){$("tmsg").textContent="உரை சரியில்லை. முழுவதும் ஒட்டவும்."}
};
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
load();setType("in");reset();render();
</script>
</body>
</html>
